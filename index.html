<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Preregistered, reproducible evidence for observable React behavior." />
    <meta name="theme-color" content="#eef3f5" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%2317272e' d='M3 3h11v11H3zm15 0h11v11H18zM3 18h11v11H3z'/%3E%3Cpath fill='none' stroke='%232457ff' stroke-width='2.5' d='M18 24h4l2-6 5 11'/%3E%3C/svg%3E" />
    <title>React Reality Lab</title>
    <script>
      // This hook must exist before ReactDOM is evaluated. It observes commits only;
      // the lab never reads fibers, lanes, flags, queues, or reconciler internals.
      // The realm rule below is the inline copy of src/realm.js: only a URL that
      // names a scenario, a variant, and a pass is a measured realm. The viewer
      // realm is left untouched so React Refresh can install its own hook.
      (() => {
        const params = new URLSearchParams(location.search);
        if (!['scenario', 'variant', 'pass'].every((name) => (params.get(name) ?? '') !== '')) return;
        const renderers = new Map();
        const commits = [];
        window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = {
          supportsFiber: true,
          renderers,
          checkDCE() {},
          inject(renderer) {
            const id = renderers.size + 1;
            renderers.set(id, renderer);
            return id;
          },
          onCommitFiberRoot(rendererId) {
            commits.push({ rendererId, at: performance.now() });
          },
          onCommitFiberUnmount() {},
          getFiberRoots() { return new Set(); },
          _commits: commits,
        };
      })();
    </script>
  </head>
  <body>
    <main id="app-root"></main>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
